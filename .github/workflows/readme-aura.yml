name: Generate README

on:
  push:
    branches: [main]
    paths: ['readme.source.md', '.github/scripts/activity.mjs', '.github/workflows/readme-aura.yml']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh contribution calendar
        run: node .github/scripts/activity.mjs

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
